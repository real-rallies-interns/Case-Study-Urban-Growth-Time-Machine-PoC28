services:
  # BACKEND SERVICE: FastAPI Intelligence Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban-growth-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - urban-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FRONTEND SERVICE: Next.js Cinematic Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the API URL relative to the frontend server for SSR/Rewrites
        - NEXT_PUBLIC_API_URL=/api/v1
    container_name: urban-growth-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - urban-net

networks:
  urban-net:
    driver: bridge
